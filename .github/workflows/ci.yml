name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Bộ test là tấm lưới duy nhất bắt được projects-index.generated.ts lệch
      # khỏi content/projects/. Thiếu bước này, lệch đó đi thẳng ra production
      # dưới dạng sitemap thiếu URL mà build vẫn xanh.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
